version: '3.8'

services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-metrology-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/legal_metrology?schema=public
      - JWT_SECRET=sih_2026_legal_metrology_jwt_super_secret_key_89213
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - MINIO_ENDPOINT=minio-s3
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - ELASTICSEARCH_NODE=http://elasticsearch-search:9200
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      - postgres-db
      - neo4j-db
      - minio-s3
      - elasticsearch-search
      - redis-cache

  postgres-db:
    image: postgres:16-alpine
    container_name: legal-metrology-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_metrology
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j-db:
    image: neo4j:5.17-community
    container_name: legal-metrology-neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP Web UI
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data

  minio-s3:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: legal-metrology-minio
    restart: always
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  elasticsearch-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: legal-metrology-elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis-cache:
    image: redis:7-alpine
    container_name: legal-metrology-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
  es_data:
  redis_data:
